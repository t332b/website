name: Supabase keepalive

# Supabase無料プランは約7日間アクセスがないとプロジェクトが一時停止されるため、定期的に軽いクエリを投げる
on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Query note_likes
        env:
          SB_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/note_likes?select=slug&limit=1")
          echo "HTTP $status"
          [ "$status" = "200" ]
