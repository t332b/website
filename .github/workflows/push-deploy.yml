name: Actions Build & FTP deploy (Lolipop)

on:
  push:
    branches: [ "main" ]
    # 必要に応じて paths フィルタを追加
    # paths:
    #   - "src/**"
    #   - "public/**"
    #   - "package.json"
    #   - "package-lock.json"
    #   - "astro.config.*"
    #   - "src/content/**"
  workflow_dispatch:

jobs:
  call-deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      ref: "main"
    secrets:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
