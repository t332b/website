name: Build & FTP deploy (Lolipop)

on:
  push:
    branches: [ "main" ]   # ← main に入ったら自動デプロイ
  workflow_dispatch:        # ← 手動実行ボタンも出す

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        # ビルドが成功した場合のみ次のステップに進む

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found!"
            exit 1
          fi
          echo "Build verification successful"

      - name: FTP Deploy to Lolipop
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: true # server-dir配下を一旦掃除→distで置き換え
          passive: true
          timeout: 120000
          # セキュリティ向上のための追加設定
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
            **/.env*
            **/.github/**
