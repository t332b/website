name: Build & FTP deploy (Lolipop)

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: "main"
      base_path:
        type: string
        required: false
        default: "/"
    secrets:
      FTP_HOST:
        required: true
      FTP_USERNAME:
        required: true
      FTP_PASSWORD:
        required: true
      FTP_REMOTE_DIR:
        required: true
      PUBLIC_SUPABASE_URL:
        required: false
      PUBLIC_SUPABASE_ANON_KEY:
        required: false

concurrency:
  group: deploy-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 依存が変わっていないときは node_modules を復元して npm install のみ（数十秒短縮）
      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: |
          if [ "${{ steps.node-cache.outputs.cache-hit }}" = "true" ]; then
            npm install
          else
            npm ci
          fi

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          ASTRO_BASE_PATH: ${{ inputs.base_path }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found!"
            exit 1
          fi
          echo "Build verification successful"

      - name: Notes embed – check musicLinks in built HTML
        run: |
          echo "--- Notes embed: __NOTE_MUSIC_LINKS__ in built note pages ---"
          empty=0
          filled=0
          for f in dist/notes/*/index.html; do
            [ -f "$f" ] || continue
            if grep -q '__NOTE_MUSIC_LINKS__ = {}' "$f" 2>/dev/null; then
              echo "[empty] $f – musicLinks は空です（タブはクライアント fetch に依存。CORS で失敗する可能性あり）"
              empty=$((empty + 1))
            elif grep -q '__NOTE_MUSIC_LINKS__' "$f" 2>/dev/null; then
              echo "[filled] $f – musicLinks が埋め込まれています"
              filled=$((filled + 1))
            fi
          done
          if [ "$empty" -eq 0 ] && [ "$filled" -eq 0 ]; then
            echo "（notes のビルド成果がありません）"
          else
            echo "--- 集計: empty=$empty, filled=$filled ---"
          fi

      # FTP はサーバー上の .ftp-deploy-sync-state.json で差分だけアップロード（新記事だけ反映）
      - name: FTP Deploy to Lolipop
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          timeout: 120000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
            **/.env*
            **/.github/**
            **/admin/vendor/**
