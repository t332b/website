name: sync-main-to-develop

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Merge main into develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge origin/main --no-edit
          git push origin develop

  # 上の push は GITHUB_TOKEN によるものなので push-deploy.yml の on:push を連鎖起動しない。
  # そのため tetetest 向けのビルド・デプロイをここで明示的に呼び出す。
  deploy-tetetest:
    needs: sync
    uses: ./.github/workflows/deploy.yml
    with:
      ref: "develop"
      base_path: "/tetetest/"
    secrets:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ endsWith(secrets.FTP_REMOTE_DIR, '/') && format('{0}tetetest/', secrets.FTP_REMOTE_DIR) || format('{0}/tetetest/', secrets.FTP_REMOTE_DIR) }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
