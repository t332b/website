<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="theme-color" content="#007cba"/>
    <title>pr0p0se CMS (Sveltia)</title>

    <link rel="cms-config-url" type="text/yaml" href="config.yml" />
    <link rel="stylesheet" href="cms.css" />

  </head>
  <body>
    <div id="nc-root"></div>
    <!-- Pinned to 0.156.3: @latest (0.156.4+) broke Cloudinary login (noopener blocks window.opener) -->
    <!-- CMS_MANUAL_INIT: ウィジェット登録後に手動でinitするため自動initを無効化 -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/@sveltia/cms@0.156.3/dist/sveltia-cms.js"></script>
    <script src="custom-widgets.js"></script>
    <script>
      // ヘッダー画像ヒントの「AI画像生成ページ」リンクをクリックしたとき、
      // CMS フォームからタイトルを読み取って URL パラメータとして渡す（ベストエフォート）
      document.addEventListener('click', function(e) {
        var link = e.target.closest('.ai-img-link');
        if (!link) return;
        e.preventDefault();

        var title = '';
        // タイトルフィールドの input を探す
        var inputs = document.querySelectorAll('input[type="text"], input:not([type])');
        inputs.forEach(function(input) {
          if (title) return;
          var container = input.closest('[class*="field"], [class*="control"], [class*="widget"]');
          if (!container) return;
          var label = container.querySelector('label') || container.previousElementSibling;
          if (label && label.textContent && label.textContent.trim().startsWith('タイトル')) {
            title = input.value;
          }
        });

        var url = link.getAttribute('href');
        if (title) url += (url.indexOf('?') === -1 ? '?' : '&') + 'title=' + encodeURIComponent(title);
        window.open(url, '_blank');
      });
    </script>
    <link href="mobile-overrides.css" rel="stylesheet" />
  </body>
</html>
