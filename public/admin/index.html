<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>CMS</title>

    <!-- 自動初期化オフ -->
    <script>window.CMS_MANUAL_INIT = true;</script>

    <!-- ★ jsDelivr に変更。バージョン固定 -->
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/decap-cms@3.8.3/dist/decap-cms.css"
      referrerpolicy="no-referrer" crossorigin="anonymous" />
    <script defer
      src="https://cdn.jsdelivr.net/npm/decap-cms@3.8.3/dist/decap-cms.js"
      referrerpolicy="no-referrer" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="nc-root"></div>

    <script>
      // 受信ログ（デバッグ用。あとで消してOK）
      window.addEventListener('message', (e) => {
        console.log('[postMessage]', e.origin, e.data);
      });

      document.addEventListener('DOMContentLoaded', () => {
        if (typeof CMS === 'undefined') {
          console.error('CMS not loaded');
          return;
        }
        CMS.init({
          config: {
            load_config_file: false,  // ★YAML読まない

            backend: {
              name: "github",
              repo: "t332-b/website",
              branch: "main",
              base_url: "https://cms-login-proxy.pages.dev",
              auth_endpoint: "/auth",
            },

            media_folder: "public/uploads",
            public_folder: "/uploads",

            collections: [
              // まず最小で映す
              {
                name: "diary", label: "日記",
                folder: "src/content/diary",
                extension: "mdx",
                create: true,
                slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
                format: "frontmatter",
                fields: [
                  { label: "タイトル", name: "title", widget: "string" },
                  { label: "日付",    name: "date",  widget: "datetime", format: "YYYY-MM-DD" },
                  { label: "本文",    name: "body",  widget: "markdown" }
                ],
              },
            ],
          }
        });
      });
    </script>
  </body>
</html>
