backend:
  name: github
  repo: <GitHubユーザー名>/<リポ名>
  branch: main
  base_url: https://<あなたのOAuthプロキシのホスト>   # ← 後で作るやつ
  # auth_endpoint: /auth   # 使うプロキシ次第。要るなら有効化

media_folder: "public/uploads"
public_folder: "/uploads"

local_backend: false  # ← 最初はfalseでOK（あとでローカル運用したければtrue+decap-serverでも可）

collections:
  - name: "diary"
    label: "日記"
    folder: "src/content/diary"
    extension: "mdx"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "著者", name: "author", widget: "select", options: ["A","B"], default: "A" }
      - { label: "タグ", name: "tags", widget: "list", required: false }
      - { label: "画像", name: "cover", widget: "image", required: false }
      - { label: "本文", name: "body", widget: "markdown" }
