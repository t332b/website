backend:
  name: github
  repo: t332-b/website
  branch: main
  base_url: https://cms-login-proxy.pages.dev   # ← Cloudflare Pages(プロキシ)のURL
  auth_endpoint: /auth                      # ← フルURLじゃなく相対

site_url: https://pr0p0se.com
display_url: https://pr0p0se.com

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "member"
    label: "メンバー"
    folder: "src/content/member"
    extension: "mdx"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "ID（英数字）", name: "id", widget: "string" }
      - { label: "表示名", name: "name", widget: "string" }
      - { label: "プロフィール", name: "bio", widget: "text", required: false }
      - { label: "GitHub", name: "github", widget: "string", required: false }
      - { label: "X(Twitter)", name: "twitter", widget: "string", required: false }
      - { label: "アイコン画像", name: "avatar", widget: "image", required: false }

  - name: "blog"
    label: "ブログ"
    folder: "src/content/blog"
    extension: "mdx"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "タイトル", name: "title", widget: "string", required: true }
      - { label: "公開日", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: true, default: "{{now}}" }
      - { label: "著者", name: "author", widget: "relation", collection: "member", search_fields: ["name","id","github"], value_field: "id", display_fields: ["name"], multiple: false, required: true }
      - { label: "タグ", name: "tags", widget: "list", required: false }
      - { label: "カバー画像", name: "cover", widget: "image", required: false }
      - { label: "本文", name: "body", widget: "markdown", required: true }
