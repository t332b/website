backend:
  name: git-gateway   # NetlifyでIdentity+Git GatewayをEnableする
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "diary"
    label: "日記"
    folder: "src/content/diary"
    extension: "mdx"          # MDXで保存
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "著者", name: "author", widget: "select", options: ["A","B"], default: "A" }
      - { label: "タグ", name: "tags", widget: "list", required: false }
      - { label: "画像", name: "cover", widget: "image", required: false }
      - { label: "本文", name: "body", widget: "markdown" }
