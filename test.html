<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circle Audio Player</title>
  <style>
    :root{
      --bg:#0f1417;           /* 背景 */
      --card:#1a2329;         /* カード */
      --ring:#2e3a41;         /* 未再生トラック */
      --progress:#1e8f54;     /* 進捗（濃い緑） */
      --knob:#a7ffcb;         /* ノブ */
      --text:#e6f1f5;
      --sub:#9bb2bd;
      --accent:#29b36b;       /* ボタンのアクセント */
      --danger:#e74c3c;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }
    html,body{height:100%;}
    body{margin:0;background:radial-gradient(1200px 800px at 70% 10%, #142026, var(--bg)); color:var(--text); font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Noto Sans JP, sans-serif;}
    .wrap{min-height:100%; display:grid; place-items:center; padding:24px;}
    .card{width:min(92vw,520px); background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01)); border:1px solid rgba(255,255,255,.06); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px;}
    .title{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
    .title h1{font-size:18px; margin:0; font-weight:600; letter-spacing:.02em}
    .meta{font-size:12px; color:var(--sub)}

    .player{display:grid; place-items:center; padding:18px 0 8px}
    .circle{position:relative; width:320px; height:320px;}
    svg{display:block; width:100%; height:100%;}
    .center-ui{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
    .center-ui .stack{pointer-events:auto; display:grid; place-items:center; gap:12px;}

    .play{ width:86px; height:86px; border-radius:999px; border:none; cursor:pointer; background:linear-gradient(180deg, var(--accent), #17894f); color:white; box-shadow:var(--shadow); display:grid; place-items:center; transition: transform .08s ease, filter .2s ease;}
    .play:active{ transform: scale(.98); }
    .play svg{ width:36px; height:36px; }

    .time{display:flex; align-items:center; gap:8px; font-feature-settings:"tnum" 1, "lnum" 1; background:#0e1518; padding:6px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.06)}

    .controls{ display:flex; align-items:center; gap:14px; margin-top:2px; justify-content:center; flex-wrap:wrap; }
    .controls .volume{ display:flex; align-items:center; gap:10px; background:#0e1518; padding:8px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.06)}
    .controls input[type="range"]{ -webkit-appearance:none; appearance:none; width:160px; height:4px; background:var(--ring); border-radius:999px; outline:none;}
    .controls input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%; background:var(--knob); border:2px solid #0a1114; box-shadow:var(--shadow); cursor:pointer;}
    .controls input[type="range"]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:var(--knob); border:2px solid #0a1114; box-shadow:var(--shadow); cursor:pointer;}

    .file{ display:flex; align-items:center; gap:10px; margin-top:14px; font-size:13px; color:var(--sub) }
    .file input{ display:block; }

    /* ツールチップ風 */
    .hint{font-size:12px; color:var(--sub); text-align:center; margin-top:10px}

    /* アクセシビリティ: キーボードフォーカス */
    button:focus-visible, input:focus-visible{ outline:2px solid #66e4a0; outline-offset:2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="region" aria-label="オーディオプレーヤー">


      <div class="player">
        <div class="circle" id="circle" aria-label="再生位置スライダー" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <svg viewBox="0 0 100 100">
            <!-- トラック（未再生） -->
            <circle cx="50" cy="50" r="42" stroke="var(--ring)" stroke-width="8" fill="none" />
            <!-- 進捗パス（濃い緑） -->
            <path id="progressPath" d="" stroke="var(--progress)" stroke-width="8" stroke-linecap="round" fill="none" />
            <!-- つまみ（ノブ） -->
            <circle id="knob" cx="50" cy="8" r="4.3" fill="var(--knob)" stroke="#0a1114" stroke-width="1.5"></circle>
          </svg>

          <div class="center-ui">
            <div class="stack">
              <button id="play" class="play" aria-label="再生/一時停止" title="スペースキーでも操作可">
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7-11-7z"/></svg>
              </button>

              <div class="controls">
                <div class="time" aria-live="polite">
                  <span id="cur">00:00</span>
                  <span>/</span>
                  <span id="dur">00:00</span>
                </div>
                <div class="volume">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5z" fill="currentColor"/><path d="M16 8a5 5 0 010 8" stroke="currentColor"/></svg>
                  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="音量" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 非表示のaudio要素（プログラム制御用） -->
      <audio id="audio" preload="metadata"></audio>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('playIcon');
    const circleEl = document.getElementById('circle');
    const progressPath = document.getElementById('progressPath');
    const knob = document.getElementById('knob');
    const curEl = document.getElementById('cur');
    const durEl = document.getElementById('dur');
    const vol = document.getElementById('vol');
    const file = document.getElementById('file');
    const filename = document.getElementById('filename');

    // 初期音量
    audio.volume = parseFloat(vol.value);



    // 再生/一時停止
    function setPlayingUI(playing){
      playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
      playIcon.innerHTML = playing
        ? '<path d="M6 6h4v12H6zM14 6h4v12h-4z"/>' // pause
        : '<path d="M8 5v14l11-7-11-7z"/>';        // play
    }
    playBtn.addEventListener('click', ()=>{
      if(audio.src === '') return; // ファイル未選択
      if(audio.paused) audio.play(); else audio.pause();
    });
    audio.addEventListener('play', ()=> setPlayingUI(true));
    audio.addEventListener('pause', ()=> setPlayingUI(false));

    // 時間表示
    const fmt = s => {
      if(!isFinite(s)) return '00:00';
      const m = Math.floor(s/60).toString().padStart(2,'0');
      const sec = Math.floor(s%60).toString().padStart(2,'0');
      return `${m}:${sec}`;
    };

    audio.addEventListener('loadedmetadata', ()=>{
      durEl.textContent = fmt(audio.duration);
      updateProgress();
    });
    audio.addEventListener('timeupdate', updateProgress);

    // 円弧描画（12時始点→時計回り）
    function polarToCartesian(cx, cy, r, deg){
      const rad = (deg-90) * Math.PI / 180.0;
      return { x: cx + (r * Math.cos(rad)), y: cy + (r * Math.sin(rad)) };
    }
    function describeArc(x, y, r, start, end){
      const startPt = polarToCartesian(x, y, r, end);
      const endPt   = polarToCartesian(x, y, r, start);
      const largeArcFlag = end - start <= 180 ? '0' : '1';
      return [
        'M', startPt.x, startPt.y,
        'A', r, r, 0, largeArcFlag, 0, endPt.x, endPt.y
      ].join(' ');
    }

    function updateProgress(){
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 0;
      curEl.textContent = fmt(cur);
      durEl.textContent = fmt(dur);

      const pct = dur ? cur / dur : 0;
      const endDeg = 360 * pct; // 0→360
      // 角度0=12時から endDeg までを描く
      if(endDeg <= 0){
        progressPath.setAttribute('d','');
      }else{
        const d = describeArc(50, 50, 42, 0, endDeg);
        progressPath.setAttribute('d', d);
      }
      // ノブ位置を更新
      const k = polarToCartesian(50,50,42, endDeg);
      knob.setAttribute('cx', k.x.toFixed(3));
      knob.setAttribute('cy', k.y.toFixed(3));
      circleEl.setAttribute('aria-valuenow', Math.round(pct*100));
    }

    // リングでのシーク（クリック/ドラッグ）
    let dragging = false;
    function pointToAngle(clientX, clientY){
      const rect = circleEl.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      let deg = (Math.atan2(dy, dx) * 180 / Math.PI) + 90; // 12時基準
      if(deg < 0) deg += 360;
      return deg; // 0..360
    }
    function withinRing(clientX, clientY){
      const rect = circleEl.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const outer = rect.width * 0.5;        // 半径=幅の半分
      const inner = outer - 26;              // トラック幅(約8) + 余白
      return dist <= outer && dist >= inner;
    }

    function seekFromClientXY(x, y){
      if(!isFinite(audio.duration)) return;
      const deg = pointToAngle(x, y);
      const pct = deg / 360;
      audio.currentTime = audio.duration * pct;
      updateProgress();
    }

    circleEl.addEventListener('pointerdown', (e)=>{
      if(withinRing(e.clientX, e.clientY)){
        dragging = true;
        circleEl.setPointerCapture(e.pointerId);
        seekFromClientXY(e.clientX, e.clientY);
      }
    });
    circleEl.addEventListener('pointermove', (e)=>{
      if(dragging){
        seekFromClientXY(e.clientX, e.clientY);
      }
    });
    const endDrag = (e)=>{ dragging = false; try{ circleEl.releasePointerCapture(e.pointerId); }catch(_){} };
    circleEl.addEventListener('pointerup', endDrag);
    circleEl.addEventListener('pointercancel', endDrag);
    circleEl.addEventListener('lostpointercapture', ()=> dragging=false);

    // キーボード操作（フォーカスを円に当てた状態）
    circleEl.addEventListener('keydown', (e)=>{
      if(!isFinite(audio.duration)) return;
      const step = 5; // 秒
      if(e.key === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration, audio.currentTime + step); e.preventDefault(); }
      if(e.key === 'ArrowLeft'){  audio.currentTime = Math.max(0, audio.currentTime - step); e.preventDefault(); }
      if(e.key === 'Home'){ audio.currentTime = 0; e.preventDefault(); }
      if(e.key === 'End'){ audio.currentTime = audio.duration; e.preventDefault(); }
      updateProgress();
    });

    // 全体のキーボード（スペースと音量）
    window.addEventListener('keydown', (e)=>{
      if(e.code === 'Space'){
        if(audio.src === '') return;
        if((document.activeElement === circleEl) || (document.activeElement === document.body) || (document.activeElement === playBtn)){
          e.preventDefault();
          if(audio.paused) audio.play(); else audio.pause();
        }
      }else if(e.key === 'ArrowUp'){
        audio.volume = Math.min(1, audio.volume + 0.05);
        vol.value = audio.volume.toFixed(2);
      }else if(e.key === 'ArrowDown'){
        audio.volume = Math.max(0, audio.volume - 0.05);
        vol.value = audio.volume.toFixed(2);
      }
    });

    // 音量
    vol.addEventListener('input', ()=>{
      audio.volume = parseFloat(vol.value);
    });

    // 再生終了時: 0に戻す
    audio.addEventListener('ended', ()=>{
      updateProgress();
      setPlayingUI(false);
    });

    // デモ用に audio.src を直指定したい場合は、以下のコメントを外して URL を設定
    audio.src = './01. intro.mp3';
    audio.load();

  </script>
</body>
</html>
